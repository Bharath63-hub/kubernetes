
name: CICD
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: k8s-web
        uses: actions/checkout@v4


      # - name: k8swebdeploy
      #   run: cd k8s-web-h

      # - name: k8swebdeploy
      #   run: cp k8s-web-h/package.json \k8s-web-h/package-lock.json \./

      - name: k8swebdeploy
        run: |
         mkdir deploy | cp -r k8s-web-h \deploy.yml \./deploy/

      - name: build
        run: docker build -t bharath6379/k8s-web:${{github.run_number}} ./deploy/k8s-web-h/

      - name: dockerlogin
        run: |
         echo "${{secrets.DOCKERPASS}}" | docker login -u ${{secrets.DOCKERUSER}} --password-stdin

      - name: dockerpush
        run: docker push bharath6379/k8s-web:${{github.run_number}}

  deploy:
   runs-on: ubuntu-latest
   needs: build
   steps:
    - name: docker pull
      run: docker pull bharath6379/k8s-web:${{github.run_number}}

    - name: git push
      run: |
       git config --global --add safe.directory /deploy/k8s-web-h/
    - name: git pushing
      run: |
       cd /deploy/k8s-web-h/ \
       git add . \git remote add origin  https://github.com/nandhinics741-hash/kubernetes \git commit -m "deploy file" \
       git push origin main
      
   
