name: CICD
on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: k8s-web
        uses: actions/checkout@v4


      # - name: k8swebdeploy
      #   run: cd k8s-web-h

      # - name: k8swebdeploy
      #   run: cp k8s-web-h/package.json \k8s-web-h/package-lock.json \./

      - name: k8swebdeploy
        run: cp -r k8s-web-h ./

      - name: build
        run: docker build -t bharath6379/k8s-web:1.1.26 .

      - name: dockerlogin
        run: |
         echo "${{secrets.DOCKERPASS}}" | docker login -u ${{secrets.DOCKERUSER}} --password-stdin

      - name: dockerpush
        run: docker push bharath6379/k8s-web:1.1.26
