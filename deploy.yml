
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-web
spec:
  selector:
    matchLabels:
      app: k8s-web
  template:
    metadata:
      labels:
        app: k8s-web
    spec:
      containers:
      - name: k8s-web
        image: bharath6379/k8s-web:1.1.26
        resources:
           limits:
            memory: "1024Mi"
            cpu: "2000m"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-web
spec:
  type: LoadBalancer
  selector:
    app: k8s-web
  ports:
  - port: 3010
    targetPort: 3000
... 